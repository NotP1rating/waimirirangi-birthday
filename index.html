<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12313a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A little birthday surprise, made with love for Waimirirangi.">
  <title>For Waimirirangi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--white:#fffaf0;--sand:#f8e6c8;--sea:#89d9e6;--sea-dark:#1a6f80;--coral:#ffb99f;--ink:#18222d;--muted:#f0e8dd}
    *{box-sizing:border-box}
    html{min-height:100%;background:#13252c}
    body{isolation:isolate;margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#324b61 0,transparent 42%),linear-gradient(155deg,#141d29,#1c2931 65%,#1b2430);color:var(--white);font-family:Manrope,ui-sans-serif,system-ui,sans-serif;overflow-x:hidden}
    .beach-video,.retry-video,.scene-image,.scene-shade{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
    .beach-video,.retry-video,.scene-image{z-index:0;object-fit:cover;opacity:0;transition:opacity .7s ease}
    .beach-video{object-position:center 55%}
    .retry-video{object-position:center center}
    .scene-image{display:none;object-position:center center}
    .scene-shade{z-index:1;background:linear-gradient(180deg,#10212a4f 0%,#10212a34 32%,#101923a6 100%);opacity:0;transition:opacity .7s ease}
    body.cover-mode .beach-video,body.cover-mode .scene-shade,body.scene-birthday .beach-video,body.scene-birthday .scene-shade{opacity:1}
    body.scene-no .scene-image,body.scene-name .scene-image{display:block;opacity:1}
    body.scene-retry .retry-video{opacity:1}
    body.scene-no .scene-image{object-position:center 42%}
    body.scene-name .scene-image{object-position:center 43%}
    body.scene-no .scene-shade{opacity:1;background:linear-gradient(180deg,#10192317 0%,#1019232e 36%,#101923b5 100%)}
    body.scene-name .scene-shade{opacity:1;background:linear-gradient(180deg,#0e1b2861 0%,#10202b80 45%,#0b1922d1 100%)}
    body.scene-retry .scene-shade{opacity:1;background:linear-gradient(180deg,#0710162e,#0710168a)}
    main{width:min(100%,600px);position:relative;z-index:2}
    .card{position:relative;padding:clamp(12px,5vw,38px);text-align:center;transition:opacity .25s ease}
    body.cover-mode main{width:min(100%,1020px)}
    body.cover-mode .card{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,72px) 22px}
    .cover-copy{max-width:900px;animation:arrive .85s cubic-bezier(.2,.8,.2,1) both}
    .cover-title{margin:0 auto 34px;color:#fff6e6;font-family:"Dancing Script","Segoe Script","Bradley Hand",cursive;font-size:clamp(3.3rem,9.4vw,7.8rem);font-weight:700;line-height:.98;letter-spacing:-.035em;text-shadow:0 4px 14px #17212b9c,0 1px 2px #1b2531;filter:drop-shadow(0 1px 0 #46352c8a)}
    .cover-title .name{display:block;margin-top:12px;font-size:.79em;line-height:1.05}
    .choices{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
    .choice{--px:50%;--py:50%;isolation:isolate;position:relative;min-width:178px;min-height:54px;overflow:hidden;padding:15px 56px 15px 28px;border:1px solid #fff9e4b3;border-radius:999px;background:radial-gradient(circle at var(--px) var(--py),#ffffff36,transparent 38%),#17333f70;color:#fffaf1;font:600 1rem Manrope,ui-sans-serif,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 28px #07141b32;backdrop-filter:blur(7px);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
    .choice::before,.choice::after{content:"";position:absolute;z-index:-1;left:-34%;bottom:-320%;width:168%;height:300%;pointer-events:none;border-radius:44% 56% 0 0;background:linear-gradient(180deg,#b7f1ed 0%,#68cbd5 42%,#328d9d 100%);transform:rotate(-4deg);transition:bottom .62s cubic-bezier(.2,.7,.2,1),transform .62s ease}
    .choice::after{left:-45%;width:190%;bottom:-330%;border-radius:56% 44% 0 0;background:linear-gradient(180deg,#e1fffa88,#59c7d088 54%,#247e9188);transform:rotate(3deg) translateX(-5%);transition-delay:.04s}
    .choice:hover::before,.choice:focus-visible::before,.choice:active::before{bottom:-181%;animation:water-sway 3.3s ease-in-out infinite}
    .choice:hover::after,.choice:focus-visible::after,.choice:active::after{bottom:-187%;animation:water-sway-back 4s ease-in-out infinite}
    .choice:hover,.choice:focus-visible{transform:translateY(-4px);border-color:#fffdf1;box-shadow:0 14px 32px #07141b52;outline:3px solid #fff9e680;outline-offset:3px}
    .choice:active{transform:translateY(-1px) scale(.98)}
    .choice:focus-visible{outline-offset:5px}
    .choice-heart{position:absolute;right:38px;top:50%;color:#fff5e4;font-size:1.05rem;opacity:0;transform:translateY(9px) scale(.65);transition:opacity .2s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
    .choice:hover .choice-heart,.choice:focus-visible .choice-heart{opacity:1;transform:translateY(-50%) scale(1)}
    .choice-arrow{position:absolute;right:19px;top:50%;font-size:1.25rem;opacity:.75;transform:translateY(-50%);transition:opacity .2s ease}
    .choice:hover .choice-arrow,.choice:focus-visible .choice-arrow{opacity:1}
    .choice.shooting .choice-arrow{animation:arrow-away .32s cubic-bezier(.2,.8,.3,1) forwards}
    .choice:disabled{cursor:default}
    @keyframes water-sway{0%,100%{transform:rotate(-4deg) translateX(-1%)}50%{transform:rotate(3deg) translateX(3%)}}
    @keyframes water-sway-back{0%,100%{transform:rotate(3deg) translateX(2%)}50%{transform:rotate(-3deg) translateX(-2%)}}
    @keyframes arrow-away{to{opacity:0;transform:translate(45px,-45px) scale(1.35)}}
    @keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .eyebrow{margin:0 0 12px;color:#f5c9a7;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0 0 15px;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2.15rem,8vw,3.5rem);line-height:1.06;letter-spacing:-.035em;text-shadow:0 3px 14px #07121bcc}
    .intro{max-width:39ch;margin:0 auto 24px;color:var(--muted);font-size:1rem;line-height:1.7;text-shadow:0 2px 8px #07121bcc}
    .step{animation:arrive .55s ease both}
    .no-step,.retry-step{width:min(100%,720px);margin:auto;padding:clamp(18px,4vw,38px);text-shadow:0 2px 12px #07121bcc}
    .no-step h1,.retry-step h1{color:#fff4df}
    .no-copy{color:var(--muted);margin:0 auto 26px;line-height:1.7;max-width:38ch}
    .name-form{width:min(100%,560px);margin:auto;padding:clamp(20px,5vw,42px);animation:arrive .55s ease both;text-shadow:0 2px 12px #07121bcc}
    .name-form h1{font-family:"Dancing Script","Segoe Script","Bradley Hand",cursive;font-size:clamp(2.8rem,7.5vw,4.25rem);font-weight:700;line-height:1.02;letter-spacing:-.02em}
    .no-step h1,.retry-step h1{font-family:Georgia,"Times New Roman",serif;font-weight:500}
    .birthday-title{font-family:"Dancing Script","Segoe Script","Bradley Hand",cursive;font-size:clamp(2.8rem,8vw,4.8rem);font-weight:700;line-height:1.02;letter-spacing:-.02em}
    .field-label{display:block;text-align:left;max-width:390px;margin:0 auto 9px;color:#f5dfc5;font-size:.88rem}
    input{display:block;width:min(100%,390px);margin:auto;padding:15px 17px;border-radius:14px;border:1px solid #ffffff82;background:#10222bd9;color:var(--white);font:500 1rem Manrope,ui-sans-serif,sans-serif;text-align:center;box-shadow:inset 0 1px 8px #07121b48,0 7px 22px #07121b44}
    input::placeholder{color:#e1d8cb}
    input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
    .feedback{min-height:26px;color:#ffdfcf;font-size:.95rem;margin:12px 0 18px}
    .heart-beat{display:inline-block;color:var(--coral);animation:heartbeat 1.6s ease-in-out infinite}
    @keyframes heartbeat{50%{transform:scale(1.16)}}
    body.scene-birthday{place-items:start center;padding:0}
    body.scene-birthday main{width:min(100%,1320px)}
    body.scene-birthday .card{padding:clamp(18px,3vw,42px)}
    .birthday-page{width:100%;max-width:1220px;margin:0 auto;padding:clamp(18px,3vw,38px) clamp(14px,3vw,36px) calc(32px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(320px,.92fr) minmax(420px,1.08fr);grid-template-areas:"title title" "gallery letter";column-gap:clamp(30px,5vw,76px);row-gap:clamp(20px,3vw,36px);align-items:center;animation:arrive .6s ease both}
    .birthday-title{grid-area:title;margin:0 auto;color:#fff6e6;text-shadow:0 4px 16px #14202bc9;text-align:center;font-size:clamp(3.6rem,7.4vw,6.5rem);}
    .birthday-title .birthday-name{display:block;margin-top:4px;color:var(--coral);font-size:.72em}
    .birthday-gallery{grid-area:gallery;width:100%;margin:0 auto}
    .gallery-frame{position:relative;width:min(100%,470px);height:min(64svh,600px);min-height:360px;margin:0 auto;overflow:hidden;border:1px solid #fff9e4aa;border-radius:22px;background:#10212aa8;box-shadow:0 18px 48px #07121b80;backdrop-filter:blur(5px)}
    .gallery-image{display:block;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .38s ease,transform 3s ease;transform:scale(1.01)}
    .gallery-image.changing{opacity:0;transform:scale(1.045)}
    .letter{grid-area:letter;max-width:34ch;margin:0 auto;color:#fff8ed;font-family:"Dancing Script","Segoe Script","Bradley Hand",cursive;font-size:clamp(1.55rem,2.6vw,2.15rem);font-weight:600;line-height:1.48;text-align:left;text-shadow:0 2px 10px #07121bcc}
    .shake{animation:shake .38s ease}
    @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    @media(max-width:600px){body{padding:0;min-height:100svh}.card{padding:22px 14px calc(22px + env(safe-area-inset-bottom))}body.cover-mode .card{padding:22px 18px}.cover-title{font-size:clamp(3rem,13vw,5rem);line-height:1}.cover-title .name{font-size:.75em;max-width:13ch;margin:14px auto 0}.cover-title{margin-bottom:30px}.choice{min-width:min(100%,165px);padding:14px 48px 14px 20px}.choices{gap:11px}.name-form .choices{gap:10px}.name-form .choice{flex:1 1 160px}.intro{font-size:.94rem}.scene-image{object-position:center 40%}body.scene-no .scene-image{object-position:center 42%}body.scene-retry .retry-video{object-position:center center}}
    @media(max-width:760px){body.scene-birthday{padding:0}body.scene-birthday main{width:100%}body.scene-birthday .card{padding:12px 0}.birthday-page{grid-template-columns:1fr;grid-template-areas:"title" "gallery" "letter";row-gap:22px;padding:24px 18px calc(32px + env(safe-area-inset-bottom))}.birthday-title{font-size:clamp(3.1rem,12vw,5rem);line-height:1}.birthday-title .birthday-name{font-size:.76em;margin-top:9px}.birthday-gallery{margin:0 auto}.gallery-frame{width:min(82vw,430px);height:min(55svh,500px);min-height:290px;border-radius:18px}.letter{width:min(100%,38ch);font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.48}}
    @media(max-width:370px){.choices{flex-direction:column;align-items:stretch}.choice{width:100%}.cover-title{font-size:clamp(2.7rem,13vw,3.4rem)}.cover-title .name{max-width:12ch}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body class="cover-mode">
  <video class="beach-video" id="beach-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="assets/beach-poster.jpg" aria-hidden="true">
    <source src="assets/beach-loop.mp4" type="video/mp4">
  </video>
  <img class="scene-image" id="scene-image" alt="" aria-hidden="true">
  <video class="retry-video" id="retry-video" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-hidden="true"><source src="assets/clapping-cat.mp4" type="video/mp4"></video>
  <div class="scene-shade" aria-hidden="true"></div>
  <main aria-live="polite">
    <section class="card" id="card"><div id="screen"></div></section>
  </main>
  <script>
    const screen = document.querySelector('#screen');
    const card = document.querySelector('#card');
    const beachVideo = document.querySelector('#beach-video');
    const sceneImage = document.querySelector('#scene-image');
    const retryVideo = document.querySelector('#retry-video');
    const boyfriendName = 'Yhaneal Sturge';

    let slideshowTimer=null;
    let photoIndex=0;
    let activeVideo=null;
    const birthdayPhotos=[
      {src:'assets/birthday-1.png',alt:'Waimirirangi smiling with a teddy bear sticker'},
      {src:'assets/birthday-2.png',alt:'Portrait of Waimirirangi wearing glasses'},
      {src:'assets/birthday-3.png',alt:'A second portrait of Waimirirangi wearing glasses'}
    ];
    const birthdayMessage="Dear Waimirirangi, thank you for making me the happiest man in the world by getting to be yours, I will admit its hard to build up the courage to ask a beautiful girl like you so far away to take a risk and commit to a guy like me and so I just want to first thank you for that as everyday I smile more when I think of you going through out my days and so I wish you Happy Birthday, I hope the lady who holds my heart can enjoy the day as I know how much she means to those who care as she brightens the room for everyone she's around just like she does for me. I hope the day is amazing and you get as much joy as you have brought all those around you through your everything. Happy Birthday and I love you ❤️";

    function tryPlayVideo(video){
      if(activeVideo!==video||document.hidden||video.readyState<2||!video.paused)return;
      const playRequest=video.play();
      if(playRequest&&typeof playRequest.catch==='function'){
        playRequest.catch(error=>{
          // Browsers may reject autoplay until the next real user gesture.
          // AbortError can also happen when the active scene changes mid-play.
          if(error.name==='AbortError'&&activeVideo===video){
            window.setTimeout(()=>tryPlayVideo(video),150);
          }
        });
      }
    }
    [beachVideo,retryVideo].forEach(video=>{
      video.muted=true;
      video.defaultMuted=true;
      video.loop=true;
      video.playsInline=true;
      video.setAttribute('muted','');
      video.setAttribute('playsinline','');
      video.setAttribute('webkit-playsinline','');
      video.addEventListener('loadeddata',()=>tryPlayVideo(video));
      video.addEventListener('canplay',()=>tryPlayVideo(video));
      video.addEventListener('loadedmetadata',()=>{
        if(activeVideo===video){try{video.currentTime=0}catch(_){}}
        tryPlayVideo(video);
      });
      video.addEventListener('ended',()=>{
        if(activeVideo!==video)return;
        try{video.currentTime=0}catch(_){}
        tryPlayVideo(video);
      });
      video.addEventListener('error',()=>{
        if(activeVideo===video)console.error('Background video failed to load:',video.currentSrc||video.src);
      });
    });
    function startLoopVideo(video){
      activeVideo=video;
      video.muted=true;
      video.defaultMuted=true;
      video.loop=true;
      video.autoplay=true;
      video.playsInline=true;
      if(video.readyState>=1){try{video.currentTime=0}catch(_){}}
      tryPlayVideo(video);
    }
    function resumeVisibleVideo(){
      if(activeVideo)tryPlayVideo(activeVideo);
    }
    ['pointerdown','keydown'].forEach(type=>document.addEventListener(type,resumeVisibleVideo,{passive:true}));
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){if(activeVideo)activeVideo.pause()}
      else resumeVisibleVideo();
    });
    function setScene(scene){
      document.body.classList.remove('cover-mode','scene-no','scene-name','scene-retry','scene-birthday');
      activeVideo=null;
      beachVideo.pause();
      retryVideo.pause();
      if(slideshowTimer){window.clearInterval(slideshowTimer);slideshowTimer=null;}
      sceneImage.removeAttribute('src');
      if(scene==='cover'||scene==='birthday'){
        document.body.classList.add(scene==='cover'?'cover-mode':'scene-birthday');
        startLoopVideo(beachVideo);
      } else {
        document.body.classList.add(`scene-${scene}`);
        if(scene==='retry')startLoopVideo(retryVideo);
        else {
          const backgrounds={no:'assets/no-cat.png',name:'assets/thinking-cat.jpg'};
          sceneImage.src=backgrounds[scene];
        }
      }
    }
    function nextBirthdayPhoto(){
      const image=document.querySelector('#birthday-photo');
      if(!image)return;
      let next=Math.floor(Math.random()*birthdayPhotos.length);
      if(birthdayPhotos.length>1&&next===photoIndex)next=(next+1+Math.floor(Math.random()*(birthdayPhotos.length-1)))%birthdayPhotos.length;
      photoIndex=next;
      image.classList.add('changing');
      window.setTimeout(()=>{
        const photo=birthdayPhotos[photoIndex];
        image.onload=()=>image.classList.remove('changing');
        image.onerror=()=>image.classList.remove('changing');
        image.alt=photo.alt;
        image.src=photo.src;
      },180);
    }
    function wireChoiceEffects(){
      document.querySelectorAll('.choice').forEach(button=>button.addEventListener('pointermove',event=>{
        const rect=button.getBoundingClientRect();
        button.style.setProperty('--px',`${((event.clientX-rect.left)/rect.width)*100}%`);
        button.style.setProperty('--py',`${((event.clientY-rect.top)/rect.height)*100}%`);
      }));
    }
    function choice(label,id){return `<button class="choice" id="${id}" type="button"><span>${label}</span><span class="choice-heart" aria-hidden="true">♥</span><span class="choice-arrow" aria-hidden="true">↗</span></button>`}
    function selectChoice(button,next){button.classList.add('shooting');button.disabled=true;window.setTimeout(next,320)}
    function renderWelcome(){
      setScene('cover');
      screen.innerHTML=`<div class="cover-copy"><h1 class="cover-title">Are you<span class="name">Waimirirangi te Whenua Atama?</span></h1><div class="choices">${choice('Yes, that’s me','yes')}${choice('No','no')}</div></div>`;
      wireChoiceEffects();
      document.querySelector('#yes').onclick=event=>selectChoice(event.currentTarget,renderName);
      document.querySelector('#no').onclick=event=>selectChoice(event.currentTarget,renderCat);
    }
    function renderCat(){
      setScene('no');
      screen.innerHTML=`<div class="no-step"><h1>Wrong person.</h1><p class="no-copy">This surprise is for Waimirirangi. The cat has made its feelings clear.</p>${choice('Okay, I’ll go','back')}</div>`;
      wireChoiceEffects();
      document.querySelector('#back').onclick=event=>selectChoice(event.currentTarget,renderWelcome);
    }
    function renderName(){
      setScene('name');
      screen.innerHTML=`<form class="name-form" id="name-form"><h1>Who’s your boyfriend?</h1><p class="intro">Type his name to unlock your birthday message.</p><label class="field-label" for="boyfriend">Boyfriend’s name</label><input id="boyfriend" name="boyfriend" autocomplete="off" placeholder="His full name" required><p class="feedback" id="feedback" aria-live="polite"></p><div class="choices"><button class="choice" type="submit"><span>Unlock my surprise</span><span class="choice-heart" aria-hidden="true">♥</span><span class="choice-arrow" aria-hidden="true">↗</span></button>${choice('Go back','back')}</div></form>`;
      wireChoiceEffects();
      document.querySelector('#name-form').onsubmit=event=>{
        event.preventDefault();
        const answer=document.querySelector('#boyfriend').value.trim().replace(/\s+/g,' ').toLocaleLowerCase();
        if(answer===boyfriendName.toLocaleLowerCase()) renderBirthday();
        else renderRetry();
      };
      document.querySelector('#back').onclick=renderWelcome;
      document.querySelector('#boyfriend').focus();
    }
    function renderRetry(){
      setScene('retry');
      screen.innerHTML=`<div class="retry-step"><h1>No, try again.</h1><p class="intro">Have another go.</p>${choice('Try again','retry')}</div>`;
      wireChoiceEffects();
      document.querySelector('#retry').onclick=event=>selectChoice(event.currentTarget,renderName);
    }
    function renderBirthday(){
      setScene('birthday');
      screen.innerHTML=`<article class="birthday-page step"><h1 class="birthday-title">Happy Birthday,<span class="birthday-name">Waimirirangi te Whenua Atama!</span></h1><section class="birthday-gallery" aria-label="Photos of Waimirirangi, changing every three seconds"><div class="gallery-frame"><img class="gallery-image" id="birthday-photo" src="assets/birthday-1.png" alt="Photo of Waimirirangi"></div></section><p class="letter">${birthdayMessage}</p></article>`;
      photoIndex=0;
      slideshowTimer=window.setInterval(nextBirthdayPhoto,3000);
    }
    renderWelcome();
  </script>
</body>
</html>
